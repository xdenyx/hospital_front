<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Процедурний кабінет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#/">Процедурний кабінет</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#/">Головна</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/patients">Пацієнти</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/requests">Заявки</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/appointments">Прийоми</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/search">Пошук</a></li>
                    <li class="nav-item" id="nav-reports" style="display: none;"><a class="nav-link" href="#/reports">Звіти</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/dictionaries">Довідники</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Вихід</a></li>
                    <li class="nav-item" id="nav-admin" style="display: none;"><a class="nav-link" href="https://hospital-course-1.onrender.com/admin/">Адміністрування</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="app"></div>
    </div>
    
    <script>
        // Проверяем авторизацию ДО загрузки приложения
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html';
        }
        
        // Достаем роль из памяти
        window.IS_ADMIN = localStorage.getItem('isAdmin') === 'true';
        if (window.IS_ADMIN) {
            document.getElementById('nav-reports').style.display = 'block';
            document.getElementById('nav-admin').style.display = 'block';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/patients.js"></script>
    <script src="js/requests.js"></script>
    <script src="js/appointments.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/dictionaries.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
